workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check

default:
  image: node:24-slim

include:
  - component: $CI_SERVER_FQDN/firstfruitslabs/components/static-site-validator/markdownlint@~latest
    inputs:
      stage: check
      job-name: check:markdownlint
  - component: $CI_SERVER_FQDN/firstfruitslabs/components/static-site-validator/markdownlint@~latest
    inputs:
      stage: check
      job-prefix: 'check:links'
      checker: lychee
